[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthmri"
version = "0.1.0"
description = "Latent diffusion for synthetic multi-modal brain-tumour MRI (BraTS 2020)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "diffusers>=0.32",
    "accelerate>=1.0",
    "nibabel>=5.0",
    "opencv-python-headless>=4.8",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "torchmetrics>=1.4",
    "torch-fidelity>=0.3.0",
    "lpips>=0.1.4",
    "monai>=1.3",
    "tensorboard>=2.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "nbformat", "nbconvert", "jupyter", "ipykernel"]

[tool.setuptools.packages.find]
include = ["synthmri*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "gpu: requires a CUDA device",
    "network: downloads pretrained weights from the HuggingFace hub",
    "slow: takes more than ~30 s",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]

[tool.ruff]
extend-exclude = ["notebooks"]   # legacy Colab notebook is kept verbatim
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]
